    <script>
      // Suppress benign Vite WebSocket HMR disconnection notices in cloud dev iframe environments
      (function() {
        function isViteHmrError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || err.reason || err.stack || String(err));
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('[vite]') !== -1
          );
        }

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmrError(arguments[i])) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (
            isViteHmrError(event.message) ||
            isViteHmrError(event.error) ||
            isViteHmrError(event.filename)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isViteHmrError(msg) || isViteHmrError(url) || isViteHmrError(error)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };
      })();
    </script>
